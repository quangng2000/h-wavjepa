_target_: src.data.sharded_audio_datamodule.ShardedAudioDataModule
# Copy the immutable completed staging index, or use s3://bucket/path/index.json.
index_path: ???
endpoint: https://storage.givemeanode.com
cache_dir: ${paths.data_dir}/shard-cache
cache_max_gib: 40
cache_min_free_gib: 2
sample_rate: 16000
num_samples: 145440
# Per rank: 32 on two GPUs, 16 on four GPUs, for global batch 64.
batch_size: 32
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2
minimum_batch_size: 2
require_full_length: true
train_random_crop: true
train_drop_last: true
# Per worker, retaining WAV bytes: this is local mixing, not corpus-wide IID.
shuffle_buffer: 128
# Bound the entire object read (including retries), then stalled worker batches.
download_timeout_seconds: 120
worker_timeout_seconds: 180
seed: ${seed}
# Pilot only: production rejects incomplete staging indexes.
allow_partial_index: false
# Restores model/optimizer; restarts iterators with a new recorded seed.
allow_stream_restart_on_resume: false
# Optional explicit binaural scenes and independently sampled masked crops.
naturalistic_manifest: null
masked_crops_per_recording: 0
masked_crop_samples: null
naturalistic_cache_gib: 12
