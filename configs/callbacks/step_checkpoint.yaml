defaults:
  - default
  - _self_

# Opt in with callbacks=step_checkpoint trainer.min_epochs=0 for infinite input.
# The first checkpoint callback is latest, so run.json points at recoverable state.
model_checkpoint:
  _target_: src.callbacks.step_checkpoint.StepCheckpoint
  filename: "step_{step:07d}"
  monitor: null
  save_top_k: 1
  save_last: link
  save_weights_only: false
  every_n_train_steps: 5000
  every_n_epochs: 0
  save_on_train_epoch_end: false

# Optional: disable with callbacks.best_checkpoint=null. This file is additional
# to the latest full-state checkpoint, never a replacement for recovery state.
best_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints/best
  filename: "best_step_{step:07d}"
  auto_insert_metric_name: false
  monitor: val/loss
  mode: min
  save_top_k: 1
  save_last: false
  save_weights_only: false
  every_n_epochs: 1
  save_on_train_epoch_end: false

early_stopping: null
rich_progress_bar: null
