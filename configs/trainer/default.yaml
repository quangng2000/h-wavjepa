_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1 # prevents early stopping
max_epochs: 10

accelerator: cpu
devices: 1

# Use full precision by default; opt into mixed precision on supported hardware.
precision: 32-true

# perform a validation loop every N training epochs
check_val_every_n_epoch: 1

# Conservative CPU/one-device default for repeatable debugging on the same stack.
# Deterministic kernels can be slower; the H100 throughput preset overrides this.
# This does not guarantee identical results across hardware or distributed layouts.
deterministic: True

gradient_clip_val: 1.0
log_every_n_steps: 1
num_sanity_val_steps: 1
enable_progress_bar: True
enable_model_summary: True
