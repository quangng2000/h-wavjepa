defaults:
  - default

accelerator: gpu
devices: 2
num_nodes: 1
strategy:
  _target_: lightning.pytorch.strategies.DDPStrategy
  # The default masked + forecasting objective uses every trainable parameter.
  # If disabling branches, use find_unused_parameters=true or freeze that branch.
  find_unused_parameters: false
  timeout:
    _target_: datetime.timedelta
    # train_segment.py raises this to cover synchronous S3 publication + 120s.
    seconds: 180
precision: bf16-mixed
# Throughput preset: seeded inputs/masks, without forcing deterministic kernels.
deterministic: false
# WAVManifestDataModule owns rank sharding, epochs and full training batches.
use_distributed_sampler: false
log_every_n_steps: 50

