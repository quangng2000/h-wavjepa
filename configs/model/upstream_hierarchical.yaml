_target_: src.models.hierarchical_wavjepa_module.HierarchicalWavJEPAModule
backbone:
  _target_: src.models.components.wavjepa_backbone.WavJEPABackbone
  # Supply an explicitly trusted official local checkpoint for pretrained initialization.
  # Null initializes the official architecture randomly; it is not a pretrained model.
  checkpoint_path: null
  # Load the pinned official Hugging Face safetensors release when true.
  pretrained: false
  pretrained_path: null
  local_files_only: false
  config:
    sample_rate: 16000
    window_samples: 32160
    conv_layers: [[512, 10, 5], [512, 3, 2], [512, 3, 2], [512, 3, 2], [512, 3, 2], [512, 2, 2]]
    encoder_dim: 768
    encoder_heads: 12
    encoder_layers: 12
    decoder_dim: 384
    decoder_heads: 12
    decoder_layers: 12
    mlp_ratio: 4.0
    average_top_k_layers: 8
    compile_modules: false
    use_gradient_checkpointing: false
    # Pack only visible student/decoder queries; teacher and objective stay dense-equivalent.
    compact_masked_tokens: false
    masker:
      target_masks_per_context: 4
      context_mask_prob: 0.65
      context_mask_length: 10
      target_prob: 0.25
      target_length: 10
      ratio_cutoff: 0.1
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 0.0001
  betas: [0.9, 0.98]
  eps: 0.000001
  weight_decay: 0.04
context_windows: 5
# Horizons and strides are completed-window units, not individual conv-token units.
# H-JEPA AntMaze reference: upper-level stride=2, window_size=1, latent_mlp.
# https://github.com/kevinghst/H-JEPA/blob/97054ecaff83e13839195ec4b92d74c08a0127c5/h_jepa/config/train/ant_hjepa_l3.yaml
# These strides are cumulative: [1, 2, 4] means per-level transitions [2, 2].
# Upper encoders subsample then apply an MLP; they do not pool adjacent states.
# Context length and audio-window horizons are our adaptation, not paper defaults.
horizons: [1, 2, 4]
state_strides: [1, 2, 4]
hierarchy: true
# Matching top-k transformations on online/EMA inputs to the upper maps.
# Old checkpoints without this field retain their original legacy readout.
readout_mode: normalized_top_k
hidden_dim: 256
predictor_layers: 2
predictor_heads: 4
prediction_weights: [1.0, 1.0, 1.0]
masked_weight: 1.0
regularization_weight: 0.1
# One penalty per distinct state space: three with hierarchy, low only when flat.
# Missing fields in older checkpoints preserve their per_level objective.
regularization_scope: unique_spaces
# LocaLeJEPA local uniform-ball matching, adapted independently per audio time step.
# Switch to sigreg for the previous Gaussian control; checkpoints enforce this choice.
regularizer_kind: localereg
localereg_clusters: 4
localereg_min_cluster_size: 4
localereg_kmeans_iters: 10
localereg_fixed_shape_kmeans: false
localereg_n_quad: 256
ema_decay: 0.999
ema_end_decay: 0.99999
# Null anneals across the resolved optimizer-step budget (including accumulation).
ema_anneal_end_step: null
lr_schedule: cosine
# Null uses 10% of total steps; an integer selects an explicit warmup duration.
lr_warmup_steps: null
# Null derives the budget from Trainer. A resumed run keeps the saved budget.
lr_total_steps: null
eval_seed: 0
# Legacy field name: random projection count for either selected regularizer.
sigreg_projections: 128
