# @package _global_
defaults:
  - audioset_nat
  - _self_

# Paper-style masked-only Nat control: 8 random crops × 16 recordings.
# No forecast/regularizer gradients; the nine-window view is unused.
tags: [audioset, wavjepa-nat, binaural, masked-only, unbenchmarked]
model:
  backbone:
    config:
      window_samples: 32160
  hierarchy: false
  prediction_weights: [0.0, 0.0, 0.0]
  regularization_weight: 0.0
  temporal_variance_weight: 0.0
  aggregation_windows: [1, 1, 1]
