# @package _global_
defaults:
  - audioset_h100
  - _self_

# Verified with 225 optimizer updates on a real AudioSet pilot on H100 SXM GPUs.
# The loss, regularizer population (64), readout and schedule are unchanged.
tags: [audioset, pointwise-hierarchy, two-h100, localereg, performance-measured]
data:
  num_workers: 2
  persistent_workers: true
  prefetch_factor: 2
model:
  backbone:
    config:
      compact_masked_tokens: true
      use_gradient_checkpointing: false
  optimizer:
    # Lightning mixed precision rejects fused AdamW with gradient clipping.
    # Keep the inherited clip norm and use the supported optimizer path.
    fused: false
  # Reduces training diagnostic collectives. Epoch training metrics are sampled;
  # every validation/test batch is still measured. Loss runs on every update.
  training_metric_interval: 50
  # Same seeded clustering and official BallReg loss; fixed-shape Lloyd updates.
  localereg_fixed_shape_kmeans: true
trainer:
  enable_progress_bar: false
callbacks:
  rich_progress_bar: null

