[project]
name = "h-wavjepa"
version = "0.1.0"
description = "Three-level waveform JEPA research scaffold with protected representations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "lightning>=2.5,<3",
  "hydra-core==1.3.2",
  "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: short local Lightning training and checkpoint checks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
