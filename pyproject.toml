[project]
name = "h-wavjepa"
version = "0.1.0"
description = "Three-level waveform JEPA training and representation extraction"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<3",
  "lightning>=2.6.6,<3",
  "hydra-core==1.3.2",
  "hydra-colorlog==1.2.0",
  "hydra-optuna-sweeper==1.2.0",
  "rootutils>=1.0.7,<2",
  "rich>=13,<15",
  "torchmetrics>=1.6,<2",
  "numpy>=1.26,<3",
  "einops==0.8.1",
  "transformers>=4.45,<5",
  "huggingface-hub>=0.26,<1",
  "safetensors>=0.4.5,<1",
]

[project.optional-dependencies]
hear = ["soundfile>=0.12,<1"]
data = ["boto3>=1.43.118,<2", "webdataset>=1.0.2,<2", "psutil>=7,<8"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pre-commit>=4,<5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["integration: short local Lightning training and checkpoint checks"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/vendor", "tests/fixtures/h_jepa"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Upstream's rootutils bootstrap intentionally precedes local imports.
"src/train.py" = ["E402"]
"src/eval.py" = ["E402"]
