# Adapted from Lightning-Hydra-Template: retain hygiene hooks; use this
# project's locked Ruff version instead of competing Black/isort formatters.
default_language_version:
  python: python3
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-toml
      - id: check-case-conflict
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint (uv lock)
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format (uv lock)
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
